<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#090D16"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#emeraldGrad)" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Tactical Clipboard Top Tab -->
  <rect x="206" y="54" width="100" height="32" rx="10" stroke="url(#emeraldGrad)" stroke-width="7" fill="#090D16" />
  <circle cx="256" cy="70" r="7" fill="#10B981" />

  <!-- Shield Outer Border -->
  <path d="M128 110 H384 V270 C384 360 256 440 256 440 C256 440 128 360 128 270 V110 Z" 
        stroke="url(#emeraldGoldGrad)" stroke-width="12" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Inner Net / Clipboard Base Lines -->
  <path d="M160 145 H352 V265 C352 335 256 395 256 395 C256 395 160 335 160 265 V145 Z" 
        stroke="#1E293B" stroke-width="6" fill="#0D1527"/>

  <!-- Ball Circle & Geometric Lines -->
  <circle cx="256" cy="245" r="72" stroke="url(#emeraldGrad)" stroke-width="7" fill="#070C16" />
  <path d="M256 173 L285 195 L274 227 H238 L227 195 Z" stroke="#34D399" stroke-width="5" fill="none"/>
  <path d="M285 195 L320 205 L328 238 L298 258 L274 227" stroke="#10B981" stroke-width="4" stroke-opacity="0.7" fill="none"/>
  <path d="M227 195 L192 205 L184 238 L214 258 L238 227" stroke="#10B981" stroke-width="4" stroke-opacity="0.7" fill="none"/>
  <path d="M238 227 L256 317 M274 227 L256 317" stroke="#10B981" stroke-width="4" stroke-opacity="0.5" fill="none"/>

  <!-- Growth Trend Arrow Overlay -->
  <path d="M136 330 L220 255 L270 295 L370 175" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M330 175 H370 V215" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
