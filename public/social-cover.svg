<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Gradient Background -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="85%" fx="20%" fy="30%">
      <stop offset="0%" stop-color="#111C24"/>
      <stop offset="50%" stop-color="#0B1017"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
    
    <radialGradient id="greenNeon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="greenBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Subtle Pitch Lines Grid background -->
  <circle cx="250" cy="150" r="350" fill="url(#greenNeon)"/>
  <circle cx="950" cy="450" r="400" fill="url(#greenNeon)"/>

  <!-- Left Content Area -->
  <g transform="translate(80, 80)">
    <!-- App Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="19" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="24" cy="19" r="6" fill="#10B981"/>
      <text x="38" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">FOOTBALL MANAGER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      Bola na Rede
    </text>
    <text x="0" y="165" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      Manager
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
      Assuma o controle total do seu clube brasileiro.
    </text>
    <text x="0" y="258" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
      Tática, mercado, finanças e CONMEBOL.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🇧🇷 Série A &amp; B</text>

      <!-- Pill 2 -->
      <rect x="147" y="0" width="145" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="165" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🏆 Libertadores</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="145" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="322" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">💼 Mercado Real</text>
    </g>

    <!-- Call to action button visual -->
    <g transform="translate(0, 395)">
      <rect width="240" height="54" rx="16" fill="url(#greenBtn)" filter="url(#shadow)"/>
      <text x="45" y="33" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Jogue Grátis Agora →</text>
    </g>
  </g>

  <!-- Right Dashboard UI Preview Card -->
  <g transform="translate(620, 65)" filter="url(#shadow)">
    <!-- Main Outer Frame -->
    <rect width="500" height="500" rx="28" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="2"/>

    <!-- Header bar inside card -->
    <rect x="24" y="24" width="452" height="48" rx="12" fill="#0F172A" fill-opacity="0.8"/>
    <circle cx="44" cy="48" r="7" fill="#EF4444"/>
    <circle cx="64" cy="48" r="7" fill="#F59E0B"/>
    <circle cx="84" cy="48" r="7" fill="#10B981"/>
    <text x="110" y="53" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Bola na Rede Manager — Rodada 24</text>

    <!-- Match Live Widget -->
    <rect x="24" y="88" width="452" height="135" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    
    <!-- Live Badge -->
    <rect x="44" y="106" width="62" height="24" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
    <circle cx="56" cy="118" r="4" fill="#EF4444"/>
    <text x="66" y="122" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">AO VIVO</text>

    <text x="410" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">78' min</text>

    <!-- Scoreboard -->
    <text x="75" y="170" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">BAHIA</text>
    <rect x="180" y="142" width="44" height="40" rx="10" fill="#1E293B"/>
    <text x="197" y="169" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">2</text>
    <text x="240" y="168" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">x</text>
    <rect x="264" y="142" width="44" height="40" rx="10" fill="#1E293B"/>
    <text x="281" y="169" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">1</text>
    <text x="330" y="170" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">PALMEIRAS</text>

    <!-- Tactical Pitch Miniature Box -->
    <g transform="translate(24, 240)">
      <rect width="216" height="224" rx="16" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5"/>
      <!-- Pitch Lines -->
      <rect x="12" y="12" width="192" height="200" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <line x1="12" y1="112" x2="204" y2="112" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="108" cy="112" r="30" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Player Nodes (4-3-3 formation preview) -->
      <circle cx="108" cy="195" r="7" fill="#10B981"/> <!-- GK -->
      <circle cx="42" cy="155" r="6" fill="#34D399"/> <!-- LB -->
      <circle cx="84" cy="165" r="6" fill="#34D399"/> <!-- CB -->
      <circle cx="132" cy="165" r="6" fill="#34D399"/> <!-- CB -->
      <circle cx="174" cy="155" r="6" fill="#34D399"/> <!-- RB -->
      <circle cx="68" cy="112" r="6" fill="#34D399"/> <!-- MC -->
      <circle cx="108" cy="120" r="6" fill="#34D399"/> <!-- MC -->
      <circle cx="148" cy="112" r="6" fill="#34D399"/> <!-- MC -->
      <circle cx="48" cy="60" r="6" fill="#F59E0B"/> <!-- LWE -->
      <circle cx="108" cy="45" r="7" fill="#F59E0B"/> <!-- ST -->
      <circle cx="168" cy="60" r="6" fill="#F59E0B"/> <!-- RWE -->
    </g>

    <!-- Stats & Management Panel -->
    <g transform="translate(256, 240)">
      <!-- Box 1: Moral -->
      <rect width="220" height="66" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MORAL DO ELENCO</text>
      <text x="16" y="52" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">92% High</text>

      <!-- Box 2: Finance -->
      <rect y="78" width="220" height="66" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CAIXA DISPONÍVEL</text>
      <text x="16" y="130" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">R$ 48.5M</text>

      <!-- Box 3: Campaign -->
      <rect y="156" width="220" height="68" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="182" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">BRASILEIRÃO 2026</text>
      <text x="16" y="208" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">1º Lugar (54 pts)</text>
    </g>
  </g>
</svg>
